groups:
  - name: campustrack-alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency"
          description: "p99 latency is {{ $value }}s over the last 5 minutes"

      - alert: HighDBConnectionCount
        expr: pg_stat_activity_count > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DB connection count"
          description: "PostgreSQL has {{ $value }} active connections"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is unreachable"

      # Piston has no built-in Prometheus exporter, so we alert on the up/down
      # probe scraped from piston-lb (see infra/prometheus/prometheus.yml —
      # add a blackbox/http probe against http://piston-lb:2000/healthz if
      # not already present) instead of an internal queue-depth metric.
      - alert: PistonUnreachable
        expr: probe_success{job="piston-lb"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Piston code execution engine unreachable"
          description: "piston-lb health probe has been failing for 2+ minutes — Run Code and coding-test grading are down"
