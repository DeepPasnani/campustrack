# Blue-Green Deployment Nginx Configuration
#
# This config routes traffic to either the "blue" or "green" backend
# environment based on the __ACTIVE_ENV__ placeholder, which is replaced
# by the deploy-blue-green.sh script during deployment.

upstream campustrack_backend {
    # Active environment — replaced by deploy-blue-green.sh (flip)
    server backend-__ACTIVE_ENV__:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream campustrack_backend_ws {
    ip_hash;
    server backend-__ACTIVE_ENV__:5000;
}

# Both colors run as scalable pools (see docker-compose.blue-green.yml).
# "backend-blue"/"backend-green" are Compose service names, each possibly
# scaled to N replicas; Docker's embedded DNS returns one A record per
# replica for the service name, so the single `server` line below expands
# to every replica of whichever color is currently active. Both colors
# listen on the same internal port (5000) — they're distinguished by
# hostname, not port. Neither publishes a host port, so health/smoke
# checks run over the internal Docker network (see scripts/deploy-blue-
# green.sh) rather than against a fixed localhost:PORT.

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API — routed to active environment
    location /api/ {
        proxy_pass http://campustrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # WebSocket
    location /ws {
        proxy_pass http://campustrack_backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Health check (accessible for monitoring)
    location /health {
        proxy_pass http://campustrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
