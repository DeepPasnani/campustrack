worker_processes auto;

events {
    # Each of ~200 concurrent students holds at most one in-flight
    # execution request against this LB at a time, so this comfortably
    # covers the target load with headroom for retries/keepalive.
    worker_connections 2048;
}

http {
    access_log off;
    sendfile   on;

    upstream piston_backends {
        least_conn;
        keepalive 64;

        server piston1:2000 max_fails=3 fail_timeout=10s;
        server piston2:2000 max_fails=3 fail_timeout=10s;
        server piston3:2000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 2000;

        client_max_body_size 10m;
        proxy_connect_timeout 5s;
        # Compilation + run can legitimately take a while for slower
        # languages (Java) under load — keep this comfortably
        # above the backend's own PISTON_RUN_TIMEOUT/PISTON_COMPILE_TIMEOUT
        # (15s), with headroom for queueing behind other jobs.
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;

        # Package installs (admin-only, one-time/rare) can take several
        # minutes — pulling + unpacking a runtime like node/java is
        # much slower than a single code execution. Give this its own much
        # longer timeout so nginx doesn't kill the connection mid-install
        # (which is what an "empty reply from server" / curl exit 52 means).
        location /api/v2/packages {
            proxy_pass http://piston_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location / {
            proxy_pass http://piston_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
