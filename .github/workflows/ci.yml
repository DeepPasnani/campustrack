name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build check (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        # Catches build-breaking errors early. Real per-environment builds
        # (with the actual VITE_API_URL/domain) happen at deploy time via
        # docker-compose.blue-green.yml's frontend-dist service — this is
        # just a compile check, not the artifact that gets deployed.
        run: npm run build
        env:
          VITE_APP_NAME: CampusTrack
          VITE_API_URL: /api
          VITE_WS_URL: wss://ci-build-check.invalid/ws

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Write CI env file
        # docker-compose.yml pulls SMTP_*/GOOGLE_*/OPENAI_* from a root
        # .env via ${VAR} substitution (see .env.example). CI doesn't need
        # real values for any of these — email/Google/AI features are all
        # designed to no-op or be skipped when unset (see .env.example).
        run: |
          cat > .env <<'EOF'
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASS=
          EMAIL_FROM=CampusTrack <noreply@example.com>
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          OPENAI_API_KEY=
          EOF
          cat > backend/.env <<'EOF'
          JWT_SECRET=ci-only-jwt-secret-not-for-production
          REFRESH_TOKEN_SECRET=ci-only-refresh-secret-not-for-production
          EOF

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "Backend is healthy"; exit 0
            fi
            sleep 5
          done
          echo "Backend never became healthy"
          docker compose -f docker-compose.yml logs backend
          exit 1

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: tests
        env:
          CI: true
          BASE_URL: http://localhost:2828
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
